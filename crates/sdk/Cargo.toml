[package]
name = "todoist-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
bon = "3.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
erased-serde = "0.4.10"
isolang = { version = "2.4.0", features = ["serde"] }
keyring = { version = "4.2.0", features = ["v1"] }
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.24.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
