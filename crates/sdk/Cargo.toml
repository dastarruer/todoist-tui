[package]
name = "todoist-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
keyring = { version = "4.2.0", features = ["v1"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
