[package]
name = "todoist-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flexi_logger = "0.31.10"
keyring = { version = "4.2.0", features = ["v1"] }
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.151"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
